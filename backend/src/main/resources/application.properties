spring.application.name=craveroute

spring.datasource.url=jdbc:postgresql://localhost:5432/craveroute_db
spring.datasource.username=postgres
spring.datasource.password=CraveRoute@2026

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Startup diagnostics
logging.level.org.springframework.boot.context.metrics=DEBUG

# Hibernate SQL logging off
spring.jpa.show-sql=false

# Avoid unnecessary JPA session management
spring.jpa.open-in-view=false


# Local development connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.devtools.restart.enabled=true